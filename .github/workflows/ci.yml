name: ci
on: [push, pull_request]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:cli-pin
      - run: npm run cli:version
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:attestor
      - run: npm run test:finality
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # Static lint is a hard gate. The installed RC linter's SDK validation
      # cannot resolve the stable v0.2.12 archive format; this limitation is
      # documented in LIVE_EVIDENCE.md and does not weaken runtime tests.
      - run: genvm-lint lint contracts/intent_guard.py --json
      - run: python scripts/preflight.py
      - run: pytest tests/direct -v

  protected-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root protected-account -vv
